<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <!-- Title & SEO Meta -->
  <title>Local Tide - Marine & Astronomical Dashboard</title>
  <meta name="description"
    content="Local coastal tide application featuring real-time MLLW water levels, immediate high/low predictions, and astronomical countdowns for Spring, Perigean, and King tides." />
  <meta name="theme-color" content="#060d17" />

  <!-- Google TV / PWA Capabilities -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

  <!-- Google Fonts Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link rel="stylesheet" href="./src/style.css" />
</head>

<body>
  <div class="app-container" id="appContainer">
    <!-- HEADER -->
    <header class="app-header" id="mainHeader">
      <div class="brand-group">
        <div class="brand-logo-wrap">
          <svg class="brand-logo-svg" viewBox="0 0 64 64" fill="none">
            <circle cx="46" cy="18" r="7" fill="#fbbf24" />
            <path d="M6 44 C 18 36, 26 50, 38 42 C 46 36, 52 40, 58 38" stroke="#38bdf8" stroke-width="3"
              stroke-linecap="round" fill="none" />
            <path d="M6 50 C 16 44, 28 54, 40 48 C 48 44, 54 47, 58 46" stroke="#00f5d4" stroke-width="2.5"
              stroke-linecap="round" fill="none" />
          </svg>
        </div>
        <div class="brand-text">
          <h1>My Tide</h1>
          <span class="brand-tagline">Marine & Astronomical Dashboard</span>
        </div>
      </div>

      <div class="header-actions">
        <div class="header-clock" id="liveClock" title="Current Local Time">--:--:--</div>

        <!-- Unit Toggle (ft / m) -->
        <button class="btn-utility" id="unitToggleBtn" title="Toggle Feet / Meters" tabindex="0">
          <span id="unitToggleIcon">📏</span>
          <span id="unitToggleLabel">Units: ft</span>
        </button>

        <!-- Time Format Toggle (12h / 24h) -->
        <button class="btn-utility" id="timeFormatToggleBtn" title="Toggle 12h / 24h Time" tabindex="0">
          <span>🕒</span>
          <span id="timeFormatLabel">12h</span>
        </button>

        <!-- TV / Kiosk Display Mode Toggle -->
        <button class="btn-utility" id="tvModeToggleBtn" title="Toggle Google TV Kiosk Display Mode" tabindex="0">
          <span>📺</span>
          <span id="tvModeLabel">TV Mode</span>
        </button>

        <!-- Refresh Button -->
        <button class="btn-utility" id="refreshDataBtn" title="Refresh Live Data" tabindex="0">
          <span id="refreshIcon">🔄</span>
          <span>Refresh</span>
        </button>
      </div>
    </header>

    <!-- LOCATION BAR & COASTAL HUBS -->
    <section id="locationContainer" aria-label="Location Selector"></section>

    <!-- MAIN DASHBOARD -->
    <main class="dashboard-main" id="dashboardMain">
      <!-- TOP SECTION: Current Status Gauge (Left) & Predictions / Chart (Right) -->
      <div class="dashboard-top-grid">
        <!-- TOP LEFT: Current Status Gauge -->
        <section id="currentGaugeContainer" class="dashboard-top-left" aria-label="Current Tide Status Gauge"></section>

        <!-- TOP RIGHT: Immediate Predictions & Tide Chart -->
        <div class="dashboard-top-right">
          <!-- Immediate Predictions (Next High & Next Low parallel panels) -->
          <section id="predictionsContainer" aria-label="Immediate Predictions"></section>

          <!-- Continuous Tide Chart Forecast -->
          <section id="chartContainer" aria-label="Water Level Forecast Chart"></section>
        </div>
      </div>

      <!-- BOTTOM ROW: The Three Extreme Tides Countdowns -->
      <section id="extremeTidesContainer" aria-label="Astronomical Extreme Tides"></section>
    </main>
  </div>

  <!-- Application Script -->
  <script type="module" src="./src/main.js"></script>
</body>

</html>
